[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locqa"
version = "0.1.0"
description = "Localization QA for Flutter ARB files"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "jinja2>=3.1"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
locqa = "locqa.cli:app"

[tool.setuptools.packages.find]
include = ["locqa*"]

[tool.setuptools.package-data]
locqa = ["profiles/*.json", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
